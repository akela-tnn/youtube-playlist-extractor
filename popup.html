<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>YouTube 清單網址擷取器</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 360px;
      margin: 0;
      padding: 14px;
      box-sizing: border-box;
      background: #f9f9f9;
      color: #333;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      font-weight: 600;
    }
    .options {
      margin-bottom: 10px;
      font-size: 13px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    button {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      background-color: #065fd4;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #004dc0;
    }
    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }
    #copyBtn {
      background-color: #0f8646;
    }
    #copyBtn:hover {
      background-color: #0a6634;
    }
    #status {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      min-height: 16px;
    }
    textarea {
      width: 100%;
      height: 190px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      resize: vertical;
      background: #fff;
      white-space: pre;
    }
  </style>
</head>
<body>
  <h3>YouTube 清單網址擷取器</h3>
  
  <div class="options">
    <label>
      <input type="checkbox" id="includeTitle"> 包含影片標題 (標題 - 網址)
    </label>
  </div>

  <div class="btn-row">
    <button id="extractBtn">開始擷取清單</button>
    <button id="copyBtn" disabled>一鍵複製</button>
  </div>

  <div id="status">請在播放清單頁面點擊按鈕</div>
  <textarea id="resultBox" placeholder="網址將一行一行列在此處..." readonly></textarea>

  <script src="popup.js"></script>
</body>
</html>
